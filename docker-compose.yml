# ============================================================================
# Docker Compose para Docker Resource Monitor
# Servicios: Django (Daphne), Celery Worker, Celery Beat, PostgreSQL, Redis
# ============================================================================

version: '3.8'

services:
  # ==================== BASE DE DATOS ====================
  db:
    image: postgres:15-alpine
    container_name: monitor_db
    environment:
      POSTGRES_DB: ${DB_NAME:-monitor_db}
      POSTGRES_USER: ${DB_USER:-monitor_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecurePass2024!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - monitor_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-monitor_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==================== REDIS ====================
  redis:
    image: redis:7-alpine
    container_name: monitor_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - monitor_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==================== APLICACIÓN DJANGO ====================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monitor_web
    command: >
      sh -c "
        echo 'Esperando a PostgreSQL...' &&
        while ! nc -z db 5432; do sleep 1; done &&
        echo 'PostgreSQL disponible' &&
        echo 'Esperando a Redis...' &&
        while ! nc -z redis 6379; do sleep 1; done &&
        echo 'Redis disponible' &&
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        daphne -b 0.0.0.0 -p 8000 config.asgi:application
      "
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - /var/run/docker.sock:/var/run/docker.sock  # Para acceder a Docker desde el contenedor
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DOCKER_HOST=unix:///var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - monitor_network
    restart: unless-stopped

  # ==================== CELERY WORKER ====================
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monitor_celery_worker
    command: >
      sh -c "
        echo 'Esperando a Redis...' &&
        while ! nc -z redis 6379; do sleep 1; done &&
        echo 'Redis disponible' &&
        celery -A config worker -l info
      "
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock  # Para acceder a Docker desde el contenedor
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DOCKER_HOST=unix:///var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - monitor_network
    restart: unless-stopped

  # ==================== CELERY BEAT ====================
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monitor_celery_beat
    command: >
      sh -c "
        echo 'Esperando a Redis...' &&
        while ! nc -z redis 6379; do sleep 1; done &&
        echo 'Redis disponible' &&
        celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
      "
    volumes:
      - .:/app
      - /var/run/docker.sock:/var/run/docker.sock  # Para acceder a Docker desde el contenedor
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DOCKER_HOST=unix:///var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - monitor_network
    restart: unless-stopped

  # ==================== NGINX (OPCIONAL - PRODUCCIÓN) ====================
  # nginx:
  #   image: nginx:alpine
  #   container_name: monitor_nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - static_volume:/app/staticfiles:ro
  #     - media_volume:/app/media:ro
  #   depends_on:
  #     - web
  #   networks:
  #     - monitor_network
  #   restart: unless-stopped

# ==================== VOLÚMENES ====================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

# ==================== REDES ====================
networks:
  monitor_network:
    driver: bridge