{% extends "base.html" %}

{% block title %}Login - Docker Monitor{% endblock %}

{% block auth_content %}
<div class="login-box">
    <div class="login-header">
        <div class="login-logo">
            <span class="material-icons-round">view_in_ar</span>
        </div>
        <h2>Welcome Back</h2>
        <p>Sign in to your Docker Monitor dashboard</p>
    </div>
    
    <form method="POST" action="{% url 'login' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="username">Username</label>
            <div class="input-icon-wrapper">
                <span class="material-icons-round input-icon">person</span>
                <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required autofocus>
            </div>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <div class="input-icon-wrapper">
                <span class="material-icons-round input-icon">lock</span>
                <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
        </div>
        
        <div class="form-options">
            <label class="custom-checkbox">
                <input type="checkbox" name="remember">
                <span class="checkmark"></span>
                Remember me
            </label>
            <a href="#" class="forgot-password">Forgot password?</a>
        </div>
        
        <button type="submit" class="btn btn-primary btn-block mt-4">
            Sign In
            <span class="material-icons-round">arrow_forward</span>
        </button>
    </form>
</div>
{% endblock %}
